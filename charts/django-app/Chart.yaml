apiVersion: v2
name: django-app
description: Helm chart that deploys the Django application on Amazon EKS, with a ConfigMap for its environment, a LoadBalancer Service and a Horizontal Pod Autoscaler.
type: application

# Chart version. Bump on every change to the chart itself.
version: 0.1.0

# Version of the application (the Django image) this chart deploys.
appVersion: "1.0.0"

keywords:
  - django
  - postgres
  - eks
  - kubernetes
  - hpa

maintainers:
  - name: VP
