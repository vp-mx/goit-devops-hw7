# Secret holding the SENSITIVE application environment variables (transferred
# from theme 4: DJANGO_SECRET_KEY, POSTGRES_PASSWORD). Kubernetes stores these
# base64-encoded at rest rather than as ConfigMap plaintext. Injected into the
# container with `envFrom` in the Deployment, same mechanism as the ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "django-app.secretName" . }}
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
