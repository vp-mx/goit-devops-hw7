# Default values for the django-app chart.
# Override any of these with --set key=value or -f my-values.yaml.

# Number of pods when the autoscaler is OFF. When autoscaling.enabled is true
# the HPA owns the replica count and this value is ignored.
replicaCount: 2

image:
  # Set this to your ECR repository URL, printed by:
  #   terraform output -raw ecr_repository_url
  # e.g. 123456789012.dkr.ecr.eu-north-1.amazonaws.com/lesson-7-ecr
  repository: REPLACE_WITH_ECR_REPOSITORY_URL
  tag: latest
  pullPolicy: IfNotPresent

# Optional image pull secrets. Not needed on EKS: the node IAM role has
# AmazonEC2ContainerRegistryReadOnly, so the kubelet pulls from ECR directly.
imagePullSecrets: []

nameOverride: "django-app"
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------
# ConfigMap: NON-secret environment variables carried over from theme 4 (see
# goit-devops-hw/.env.example). Rendered into a ConfigMap and injected into
# the pod with envFrom.
# ---------------------------------------------------------------------------
config:
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: "*"

  # PostgreSQL connection settings (theme 4). POSTGRES_HOST is NOT listed
  # here on purpose: templates/configmap.yaml sets it automatically to the
  # in-cluster Postgres below when postgresql.enabled=true. If you disable
  # postgresql and point at an external database instead (e.g. Amazon RDS),
  # set it explicitly: --set config.POSTGRES_HOST=<your-rds-endpoint>.
  POSTGRES_DB: "app_db"
  POSTGRES_USER: "app_user"
  POSTGRES_PORT: "5432"

# ---------------------------------------------------------------------------
# Secret: SENSITIVE environment variables carried over from theme 4. Rendered
# into a Kubernetes Secret (base64-encoded at rest) and injected into the pod
# with envFrom, same mechanism as the ConfigMap above — different resource
# type. Override these with --set or a gitignored values file; never commit
# real values here.
# ---------------------------------------------------------------------------
secrets:
  DJANGO_SECRET_KEY: "change-me-in-production"
  POSTGRES_PASSWORD: "change-me"

# ---------------------------------------------------------------------------
# In-cluster PostgreSQL (like theme 4's docker-compose "db" service): a
# single-replica StatefulSet + headless Service, deployed by this same chart
# so `helm install` works with zero extra setup. It reuses the ConfigMap and
# Secret above for its own POSTGRES_DB/USER/PASSWORD — one source of truth
# for both the app and the database.
#
# Set postgresql.enabled=false to skip this and point config.POSTGRES_HOST at
# an external database (e.g. Amazon RDS) instead — recommended for anything
# beyond learning/testing, since this Postgres has no backups/HA/failover.
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  persistence:
    # Requires the EBS CSI driver add-on (installed by modules/eks) so the
    # PVC actually binds. Set to false to use an ephemeral emptyDir instead
    # (data lost on pod restart — fine for a quick smoke test).
    enabled: true
    size: 5Gi
    storageClassName: gp2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ---------------------------------------------------------------------------
# Service: type LoadBalancer so AWS provisions an external load balancer with
# a public DNS name / IP for external access.
# ---------------------------------------------------------------------------
service:
  type: LoadBalancer
  port: 80 # port exposed by the load balancer; forwards to the container's http port
  annotations: {}

# ---------------------------------------------------------------------------
# Horizontal Pod Autoscaler: scale between 2 and 6 pods, target 70% CPU.
# Requires metrics-server in the cluster and resource requests below.
# ---------------------------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Resource requests/limits. The CPU *request* is what the HPA percentage is
# measured against, so it must be set for the autoscaler to work.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Container port Django's runserver listens on inside the pod (see Dockerfile).
containerPort: 8000

# Liveness/readiness/startup probes hit "/" — the only route the app exposes
# (core.views.index), which also proves the DB connection works.
probes:
  path: /

# ---------------------------------------------------------------------------
# Ingress (BONUS): disabled by default. Enable to expose the app over a custom
# domain with TLS via cert-manager. Requires an ingress controller (nginx) and
# cert-manager with a ClusterIssuer installed in the cluster. See README.md
# for the full walkthrough with a Cloudflare-managed domain.
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  host: yourdomain.com
  path: /
  pathType: Prefix
  tls: true
  clusterIssuer: letsencrypt-prod
  annotations: {}

# Extra pod scheduling controls (optional).
nodeSelector: {}
tolerations: []
affinity: {}
